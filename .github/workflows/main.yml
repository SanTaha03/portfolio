name: Build and Deploy
on:
  push:
    branches:
      - main
    
  pull_request:
    branches:
      - main
jobs:
  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest

    steps:
        - name: Checkout Repository
          uses: actions/checkout@v3
        
        - name: Install dependencies
          run: npm install
        
        - name: Build Next.js Application
          run: npm run build
        
        - name: Build Docker Image
          run: docker build -t portfolio .
        
        